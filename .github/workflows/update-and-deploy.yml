name: Update roster data and deploy

on:
  schedule:
    # Every 3 hours
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest WoWthing data
        env:
          WOWTHING_SESSION_COOKIE: ${{ secrets.WOWTHING_SESSION_COOKIE }}
        run: python3 scripts/fetch_data.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update roster data [automated]"
          git push

  deploy:
    needs: update-data
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (in case update-data committed)
        run: git pull

      - name: Stamp cache-busting build version
        run: |
          VERSION="$(git rev-parse --short HEAD)-$(date +%s)"
          sed -i "s/BUILD_VERSION/${VERSION}/g" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
