name: Temp diagnostic
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography --quiet
      - name: Run diagnostic
        run: |
          python3 scripts/_diag_rostered_history.py > /tmp/diagout.txt 2>&1 || true
          echo "::notice::$(cat /tmp/diagout.txt | tr '\n' '|')"
