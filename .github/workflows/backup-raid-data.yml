name: Backup raid sales data

on:
  schedule:
    # Once a day
    - cron: "43 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Back up raid sales data from JSONBin
        run: |
          python3 scripts/backup_raid_data.py 2>backup_stderr.txt || {
            echo "::error::$(cat backup_stderr.txt)"
            exit 1
          }

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- backups; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit backup
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups
          git commit -m "Daily raid data backup [automated]"
          git pull --rebase
          git push
