<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Current Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=BUILD_VERSION" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Current Roster</h1>
    </div>
    <button id="refresh-btn" class="refresh-btn" type="button">
      <span class="refresh-icon">&#x21bb;</span> Refresh
    </button>
  </div>
</header>

<main class="page">

  <div class="page-toolbar">
    <div id="page-controls" class="page-controls" hidden>
      <button id="page-prev" class="page-btn" type="button">&larr; Prev</button>
      <span id="page-indicator" class="page-indicator"></span>
      <button id="page-next" class="page-btn" type="button">Next &rarr;</button>
    </div>
    <button id="warband-btn" class="page-btn" type="button" hidden>Warband Bank</button>
  </div>

  <div class="table-scroll">
    <table id="roster-table" class="roster-table">
      <thead id="roster-thead"></thead>
      <tbody id="roster-tbody"></tbody>
    </table>
  </div>

  <section id="warband-panel" class="detail-panel" hidden>
    <div class="detail-panel-inner">
      <button id="warband-close" class="detail-close" aria-label="Close">&times;</button>
      <h2>Warband Bank</h2>
      <ul id="warband-list" class="gear-list"></ul>
    </div>
  </section>

  <section id="detail-panel" class="detail-panel" hidden>
    <div class="detail-panel-inner">
      <button id="detail-close" class="detail-close" aria-label="Close">&times;</button>
      <h2 id="detail-name"></h2>
      <p id="detail-meta" class="detail-meta"></p>

      <section class="detail-block">
        <h3>Equipped gear</h3>
        <ul id="detail-equipped" class="gear-list"></ul>
      </section>

      <section class="detail-block">
        <h3>Bag &amp; bank items</h3>
        <ul id="detail-bags" class="gear-list"></ul>
      </section>
    </div>
  </section>

  <footer class="page-footer">
    <p id="generated-at">—</p>
    <p id="reset-countdown">—</p>
    <p class="footer-note">Data refreshes automatically on a schedule via GitHub Actions. Season/crest currency IDs are hand-pinned to the current patch and may need updating after a new one.</p>
  </footer>

</main>

<script>
  var wowhead_tooltips = { colorlinks: true, iconizelinks: false, renamelinks: false };
</script>
<script src="https://wow.zamimg.com/widgets/power.js"></script>
<script src="app.js?v=BUILD_VERSION"></script>
</body>
</html>
